<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>入会申し込み03</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="content">
      <h1>入会申し込み</h1>
      <p>入会するには次のフォームに必要事項を記入してください</p>
      <p>
        <label for="mymail"
          >メールアドレス:<input id="mymail" type="email" name="mymail"
        /></label>
      </p>
      <p>
        <label for="mypass"
          >パスワード<input id="mypass" type="password" name="mypass"
        /></label>
      </p>
      <p><button type="submit">登録する</button></p>
    </div>
  </body>
</html>
