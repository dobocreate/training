<!DOCTYPE html>
<html lnag="ja">
    <head>
        <title>todo_js</title>
        <meta charset="UTF-8"/>
        <link rel="stylesheet"href="todo.css">
    </head>

    <body>
        <div class="input-area">
            <input id="add-text" placeholder="TODOを入力"></input>
            <button id="add-button" type=”button” onclick="onClickAdd()">追加</button>
        </div>
        <div class="incomplete-area">
            <p class="title">未完了のTODO</p>
            <ul id="incomplete-list">
                <li>
                    <div class="list-raw">
                        <p class="todo-item">TODOです</p>
                        <button>完了</button>
                        <button>削除</button>
                    </div>
                </li>
            </ul>
        </div>
        <div class="complete-area">
            <p class="title">完了のTODO</p>
            <ul>
                <li>
                    <div class="list-raw">
                        <p class="todo-item">TODOでした</p>
                        <button>戻す</button>
                    </div>
                </li>
            </ul>
        </div>
        <script src="./todo.js" type="module"></script>
    </body>
</html>
