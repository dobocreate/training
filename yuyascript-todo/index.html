<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo</title>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="input-area">
      <input type="text" placeholder="ToDoを入力" />

    </div>
    <script src="index.js"></script>
  </body>
</html>
