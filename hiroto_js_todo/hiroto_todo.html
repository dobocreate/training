<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODOリスト</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="inputField" class="inputField">
      <input type="text" id="todoInput" placeholder="TODOを入力" />
      <button id="triggerButton" type="button">追加</button>
    </div>
    <ul id="incompleteList" class="incompleteList">
      <h3>未完了のTODO</h3>
    </ul>
    <ul id="completeList" class="completeList">
      <h3>完了したTODO</h3>
    </ul>
    <script src="main.js"></script>
  </body>
</html>
